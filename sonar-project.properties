# SonarQube Cloud (SonarCloud) configuration.
# Analysis runs from CI (.github/workflows/ci.yml) — Automatic Analysis must be
# OFF in the project's settings, since coverage is only supported via CI analysis.
sonar.organization=njunge11
sonar.projectKey=Njunge11_tend

# Production sources vs. tests (tests are colocated as src/**/*.test.ts plus the test/ dir).
# __fixtures__ holds test-support code (e.g. a stand-in IPC worker), so it's classified as test
# code, not production source needing coverage.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.test.ts,test/**/*.ts,src/**/__fixtures__/**

# Coverage report produced by `pnpm test:coverage` (vitest v8 + lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Heap for the JS/TS analyzer's Node.js bridge process. Full-project analysis
# started OOMing on 2026-06-09 (same analyzer version 12.5.0.41048 that passed
# hours earlier at the 4288 MB default — the repo's content crossed a memory
# cliff in the analyzer, not a SonarCloud update). 6144 still OOMed; the runner
# has 16 GB, so give the bridge 12 GB. debugMemory logs heap evolution so a
# future failure names the offending file instead of dying silently.
sonar.javascript.node.maxspace=12288
sonar.javascript.node.debugMemory=true

# Don't count tests, the CLI shim, or shipped configs toward coverage. (Fixtures under __fixtures__
# are classified as test code via sonar.test.inclusions above, so they're not production lines to
# cover. The eslint worker entry is NOT excluded — its logic lives in serveEslintScans, which is
# unit-tested; only a few lines of subprocess-only glue remain uncovered.)
sonar.coverage.exclusions=src/**/*.test.ts,test/**,src/bin.ts,configs/**

# Keep build output and fixtures out of analysis entirely.
sonar.exclusions=dist/**,node_modules/**,coverage/**,test/fixtures/**
