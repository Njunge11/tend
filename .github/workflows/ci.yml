name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the step `if` below can detect its absence
      # (fork PRs don't get repo secrets — we skip Sonar there instead of failing).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v6
        with:
          # SonarCloud needs full history for accurate blame / new-code detection.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Smoke test built CLI
        run: node dist/bin.js --help

      - name: SonarQube Scan
        # Run once (not per Node version) and only when the token is available.
        if: ${{ matrix.node == '20' && env.SONAR_TOKEN != '' }}
        # Don't fail CI on SonarSource's intermittent CDN 403s when downloading the
        # scanner — analysis is supplementary; tests/build are the real gate. The
        # next push re-analyzes. See community.sonarsource.com/t/.../183214
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8
