name: Release

# Publishes to npm only when you cut a GitHub Release (Releases -> Draft a new
# release -> create tag vX.Y.Z -> Publish). Merging to main never publishes.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC — required for npm trusted publishing + provenance.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0; `22` resolves to latest 22.x.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION'. Bump package.json and re-tag."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Publish
        # No NODE_AUTH_TOKEN: npm exchanges the OIDC token automatically and
        # attaches provenance. Requires a Trusted Publisher configured on npmjs.com.
        run: npm publish --access public
